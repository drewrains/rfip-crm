<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RFIP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c8102e'/%3E%3Cpath d='M8 22V10h7a4 4 0 010 8h-7M15 18l5 4' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RFIP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=20261008p">
</head>
<body>
<div id="signin" class="signin" hidden>
  <div class="signin-card">
    <div class="brand big">RF<span>IP</span></div>
    <form id="pwForm" class="pw-form">
      <label class="lab" for="pwEmail">Email</label>
      <input class="inp" id="pwEmail" type="email" autocomplete="username" required placeholder="you@rfip.com">
      <label class="lab" for="pwPass">Password</label>
      <input class="inp" id="pwPass" type="password" autocomplete="current-password" required>
      <button class="btn primary wide" type="submit" id="pwSubmit">Sign in</button>
    </form>
    <div id="msBlock" hidden>
      <div class="or"><span>or</span></div>
      <button class="btn wide" id="msLogin">Sign in with Microsoft</button>
    </div>
    <p class="error" id="signinError" hidden></p>
    <p class="muted small-print">Need access or a password reset? Ask an admin.</p>
  </div>
</div>

<div id="app" hidden>
  <header class="bar"><div class="wrap">
    <div class="brand">RF<span>IP</span><span id="brandSub" hidden></span><em id="envTag" class="env" hidden title="You're in the test environment. Nothing here touches live data.">Test</em></div>
    <div class="sections" id="sections" role="group" aria-label="Section" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
    <div class="me">
      <button class="btn primary" id="newDeal">+ New deal</button>
      <button class="btn small" id="feedbackBtn" title="Report a problem or send an idea">Feedback</button>
      <button class="btn small" id="changePw" hidden>Password</button>
      <button class="btn small" id="signOut" title="Sign out"><span id="meName"></span><span>Sign out</span></button>
    </div>
  </div></header>
  <main class="wrap">
    <div id="status" class="notice" hidden></div>
    <section class="strip" id="strip" aria-label="Summary"></section>
    <section id="view"></section>
  </main>
</div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js?v=20261008p"></script>
<script src="ops.js?v=20261008p"></script>
<script src="app.js?v=20261008p"></script>
</body>
</html>
